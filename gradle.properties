#android.defaults.buildfeatures.resvalues=true
android.dependency.useConstraints=true
#android.enableAppCompileTimeRClass=false
#android.r8.optimizedResourceShrinking=false
android.r8.strictFullModeForKeepRules=false
#android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
# AGP 9.0 default is true - package names are already unique (fr.geoking.gaston vs fr.geoking.gaston.shared)
android.uniquePackageNames=true
android.useAndroidX=true
# Raise Metaspace: 768m OOMs on long AGP9/KMP/R8 sessions (R8 then emits misleading kotlin-metadata warnings).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.caching=true

# Ignore broken / wrong-arch JDKs auto-detected from IntelliJ (~/Library/Java/..., often x86_64 on arm64 Mac).
# Use JAVA_HOME (mise java@21 via `mise.toml`) or the JVM that launches Gradle instead.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Warning mode: 'none' suppresses deprecation warnings from plugin internals
# Known deprecation warnings from Kotlin Multiplatform plugin 2.3.0 (internal plugin issues):
# - Archives configuration: KMP plugin uses archives internally for artifact creation (line 24 in shared/build.gradle.kts when creating jvm("desktop"))
# - Multi-string dependency notation: KMP plugin uses this for native prebuilt dependencies (kotlin-native-prebuilt:2.3.0:macos-x86_64@tar.gz)
# These are internal to the plugin and cannot be fixed in our build scripts.
# Kotlin 2.3.0 officially supports Gradle 7.6.3-9.0.0. Gradle 10 compatibility will come in future plugin versions.
# Setting to 'none' since these warnings are expected and will be resolved by the plugin authors.
org.gradle.warning.mode=none

# Kotlin: compileOnly in commonMain is intentional (Compose not shipped to Native); exposing as api would pull it into iOS.
kotlin.suppressGradlePluginWarnings=IncorrectCompileOnlyDependencyWarning

# Shared KMP: skip JVM desktop + iOS targets for faster local/CI builds. Set true to build frameworks/desktop again.
gaston.kmp.hostTargetsEnabled=false

# Global developer settings toggle
debug_dev=true