# Ingest File dumps + daily fuel history into D1.
# Prefer one heavy source per run (D1 Free ~100k writes/day).

name: Backend ingest

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to ingest"
        required: true
        default: "fuel-history"
        type: choice
        options:
          - fuel-history
          - luxembourg-radars
          - france-radars
          - belgium-nap
          - dotnl
          - gireve
          - qualicharge
          - minetur
          - mimit
          - merged-irve
          - open-toll-data
      target:
        description: "D1 target"
        required: true
        default: "remote"
        type: choice
        options:
          - remote
          - local
  schedule:
    # Daily UTC: tiny LU radars + FR fuel history / Stooq (low writes).
    - cron: "0 3 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Pick source
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=schedule" >> "$GITHUB_OUTPUT"
            echo "flag=--remote" >> "$GITHUB_OUTPUT"
          else
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "source=${{ inputs.source }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.target }}" = "remote" ]; then
              echo "flag=--remote" >> "$GITHUB_OUTPUT"
            else
              echo "flag=--local" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Ingest (manual)
        if: steps.pick.outputs.mode == 'manual'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ingest/run.mjs --source=${{ steps.pick.outputs.source }} ${{ steps.pick.outputs.flag }}
      - name: Ingest schedule (LU + fuel history)
        if: steps.pick.outputs.mode == 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/ingest/run.mjs --source=luxembourg-radars --remote
          node scripts/ingest/run.mjs --source=fuel-history --remote
