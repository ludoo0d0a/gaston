# Phase 0: skeleton only — no real CSV fetch yet.
# Manual run: Actions → "Backend ingest (stub)" → Run workflow

name: Backend ingest (stub)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source id (stub ignores; reserved for Phase 1)"
        required: false
        default: "all"
        type: string

jobs:
  ingest-stub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Run ingest stub
        run: npm run ingest:stub
      # Phase 1: write D1/R2 with CLOUDFLARE_API_TOKEN secrets
