# Phase 1: ingest File dumps into D1 (local or remote). Prefer one source per run (D1 Free write budget).

name: Backend ingest

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to ingest"
        required: true
        default: "luxembourg-radars"
        type: choice
        options:
          - luxembourg-radars
          - france-radars
          - gireve
          - qualicharge
          - minetur
          - mimit
          - merged-irve
      target:
        description: "D1 target"
        required: true
        default: "remote"
        type: choice
        options:
          - remote
          - local
  schedule:
    # Daily UTC — Luxembourg only (tiny). Heavy dumps: run manually / separate days.
    - cron: "0 3 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Pick source
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "source=luxembourg-radars" >> "$GITHUB_OUTPUT"
            echo "flag=--remote" >> "$GITHUB_OUTPUT"
          else
            echo "source=${{ inputs.source }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.target }}" = "remote" ]; then
              echo "flag=--remote" >> "$GITHUB_OUTPUT"
            else
              echo "flag=--local" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ingest/run.mjs --source=${{ steps.pick.outputs.source }} ${{ steps.pick.outputs.flag }}
