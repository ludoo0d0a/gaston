name: PR build (merge with main)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (PR merged into main)
        uses: actions/checkout@v4
        with:
          # On pull_request events, this checks out GitHub's synthetic merge commit
          # (equivalent to merging the PR branch into main for validation).
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check for committed API keys
        run: bash scripts/check-no-secrets.sh

      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Optional in PR builds: if the secret isn't available (e.g. PR from a fork),
          # the build still works because androidApp/build.gradle.kts only applies the
          # Google Services plugin when the file exists.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json
            if jq -e . androidApp/google-services.json >/dev/null 2>&1; then
              echo "google-services.json written ($(wc -c < androidApp/google-services.json) bytes)"
            else
              echo "::warning::GOOGLE_SERVICES_JSON did not contain valid JSON; building without Firebase."
              rm -f androidApp/google-services.json
            fi
          else
            echo "GOOGLE_SERVICES_JSON not set; building without Firebase."
          fi

      - name: Build
        env:
          # Unset secrets resolve to "" so requireProp in build.gradle.kts succeeds.
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          OPENCHARGEMAP_KEY: ${{ secrets.OPENCHARGEMAP_KEY }}
          MOBILITEIT_LUXEMBOURG_KEY: ${{ secrets.MOBILITEIT_LUXEMBOURG_KEY }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          CHARGY_API_KEY: ${{ secrets.CHARGY_API_KEY }}
          GERMANY_TANKERKOENIG_KEY: ${{ secrets.GERMANY_TANKERKOENIG_KEY }}
          FASTNED_UK_KEY: ${{ secrets.FASTNED_UK_KEY }}
          ROMANIA_PECO_APPLICATION_ID: ${{ secrets.ROMANIA_PECO_APPLICATION_ID }}
          ROMANIA_PECO_CLIENT_KEY: ${{ secrets.ROMANIA_PECO_CLIENT_KEY }}
          DKV_SUBSCRIPTION_KEY: ${{ secrets.DKV_SUBSCRIPTION_KEY }}
          DKV_AUTHORIZATION: ${{ secrets.DKV_AUTHORIZATION }}
          ECO_MOVEMENT_KEY: ${{ secrets.ECO_MOVEMENT_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          FUELPRICES_DK_KEY: ${{ secrets.FUELPRICES_DK_KEY }}
          NSW_FUELCHECK_KEY: ${{ secrets.NSW_FUELCHECK_KEY }}
          NSW_FUELCHECK_SECRET: ${{ secrets.NSW_FUELCHECK_SECRET }}
        run: |
          # Build + lint to catch issues early (including 16KB page-size native library alignment).
          ./gradlew --no-daemon :androidApp:assembleDebug :androidApp:lintFullDebug :shared:build
