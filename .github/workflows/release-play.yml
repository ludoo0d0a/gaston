name: Release to Play Store

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      changesNotSentForReview:
        description: 'Skip auto-review (managed publishing / draft-style)'
        default: false
        type: boolean

concurrency:
  group: play-release
  cancel-in-progress: true

# Project-scoped secrets → env. Kept here, not in geoking-ci.
env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON || secrets.SERVICE_ACCOUNT_JSON }}
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
  GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
  GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
  WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
  OPENCHARGEMAP_KEY: ${{ secrets.OPENCHARGEMAP_KEY }}
  LUFOP_API_KEY: ${{ secrets.LUFOP_API_KEY }}
  MOBILITEIT_LUXEMBOURG_KEY: ${{ secrets.MOBILITEIT_LUXEMBOURG_KEY }}
  TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
  CHARGY_API_KEY: ${{ secrets.CHARGY_API_KEY }}
  GERMANY_TANKERKOENIG_KEY: ${{ secrets.GERMANY_TANKERKOENIG_KEY }}
  FASTNED_UK_KEY: ${{ secrets.FASTNED_UK_KEY }}
  ROMANIA_PECO_APPLICATION_ID: ${{ secrets.ROMANIA_PECO_APPLICATION_ID }}
  ROMANIA_PECO_CLIENT_KEY: ${{ secrets.ROMANIA_PECO_CLIENT_KEY }}
  DKV_SUBSCRIPTION_KEY: ${{ secrets.DKV_SUBSCRIPTION_KEY }}
  DKV_AUTHORIZATION: ${{ secrets.DKV_AUTHORIZATION }}
  ECO_MOVEMENT_KEY: ${{ secrets.ECO_MOVEMENT_KEY }}
  REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
  FUELPRICES_DK_KEY: ${{ secrets.FUELPRICES_DK_KEY }}
  NSW_FUELCHECK_KEY: ${{ secrets.NSW_FUELCHECK_KEY }}
  NSW_FUELCHECK_SECRET: ${{ secrets.NSW_FUELCHECK_SECRET }}
  # DEBUG_DEV unused here: playstore flavor forces BuildConfig.DEBUG_DEV=false.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release to Play
        uses: ludoo0d0a/geoking-ci/actions/gk-release-play@main
        with:
          package_name: fr.geoking.gaston
          gradle_module: ':androidApp'
          bundle_task: bundlePlaystoreRelease
          aab_glob: 'androidApp/build/outputs/bundle/playstoreRelease/*.aab'
          google_services_path: 'androidApp/google-services.json'
          whatsnew_script: geoking-tools/bin/whatsnew.py
          unit_test_tasks: ':androidApp:testFullDebugUnitTest :shared:testAndroidHostTest'
          gradle_version: wrapper
          java_version: '21'
          version_name_override: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          is_workflow_dispatch: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          workflow_dispatch_track: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.track || '' }}
          workflow_dispatch_skip_review: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.changesNotSentForReview == 'true' && 'true' || 'false' }}
