name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Project-scoped Gradle keys (repo secrets → env). Kept here, not in geoking-ci.
env:
  GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
  GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
  WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
  OPENCHARGEMAP_KEY: ${{ secrets.OPENCHARGEMAP_KEY }}
  LUFOP_API_KEY: ${{ secrets.LUFOP_API_KEY }}
  MOBILITEIT_LUXEMBOURG_KEY: ${{ secrets.MOBILITEIT_LUXEMBOURG_KEY }}
  TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
  CHARGY_API_KEY: ${{ secrets.CHARGY_API_KEY }}
  GERMANY_TANKERKOENIG_KEY: ${{ secrets.GERMANY_TANKERKOENIG_KEY }}
  FASTNED_UK_KEY: ${{ secrets.FASTNED_UK_KEY }}
  ROMANIA_PECO_APPLICATION_ID: ${{ secrets.ROMANIA_PECO_APPLICATION_ID }}
  ROMANIA_PECO_CLIENT_KEY: ${{ secrets.ROMANIA_PECO_CLIENT_KEY }}
  DKV_SUBSCRIPTION_KEY: ${{ secrets.DKV_SUBSCRIPTION_KEY }}
  DKV_AUTHORIZATION: ${{ secrets.DKV_AUTHORIZATION }}
  ECO_MOVEMENT_KEY: ${{ secrets.ECO_MOVEMENT_KEY }}
  REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
  FUELPRICES_DK_KEY: ${{ secrets.FUELPRICES_DK_KEY }}
  NSW_FUELCHECK_KEY: ${{ secrets.NSW_FUELCHECK_KEY }}
  NSW_FUELCHECK_SECRET: ${{ secrets.NSW_FUELCHECK_SECRET }}

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed API keys
        run: bash scripts/check-no-secrets.sh

  build:
    needs: secrets-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout geoking-ci
        uses: actions/checkout@v4
        with:
          repository: ludoo0d0a/geoking-ci
          path: geoking-ci

      - name: Checkout geoking-tools
        uses: actions/checkout@v4
        with:
          repository: ludoo0d0a/geoking-tools
          path: geoking-tools

      - name: Setup Gradle
        uses: ./geoking-ci/actions/setup-gradle
        with:
          gradle-version: wrapper
          java-version: '21'

      - name: Write google-services.json (optional on fork PRs)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON not set; assemble without Firebase."
            exit 0
          fi
          bash geoking-ci/scripts/write-google-services.sh androidApp/google-services.json

      - name: Assemble debug APK
        env:
          GK_TOOLS: ${{ github.workspace }}/geoking-tools
        run: ./gradlew :androidApp:assembleFullDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gaston-debug-apk
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: warn

  lint:
    needs: secrets-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout geoking-tools
        uses: actions/checkout@v4
        with:
          repository: ludoo0d0a/geoking-tools
          path: geoking-tools

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write google-services.json (optional on fork PRs)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON not set; lint without Firebase."
            exit 0
          fi
          mkdir -p androidApp
          tmp="$(mktemp)"
          if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode >"$tmp" 2>/dev/null \
            && jq -e . "$tmp" >/dev/null 2>&1; then
            mv "$tmp" androidApp/google-services.json
          elif printf '%s' "$GOOGLE_SERVICES_JSON" >"$tmp" && jq -e . "$tmp" >/dev/null 2>&1; then
            mv "$tmp" androidApp/google-services.json
          else
            rm -f "$tmp"
            echo "::warning::GOOGLE_SERVICES_JSON invalid; lint without Firebase."
            exit 0
          fi

      - name: Lint
        env:
          GK_TOOLS: ${{ github.workspace }}/geoking-tools
        run: ./gradlew --no-daemon :androidApp:lintFullDebug :shared:build
