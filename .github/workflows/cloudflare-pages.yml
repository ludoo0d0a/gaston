name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

# Nested geoking-ci job needs deployments:write (GitHub deploy status).
permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ludoo0d0a/geoking-ci/.github/workflows/cloudflare-pages.yml@main
    permissions:
      contents: read
      deployments: write
    with:
      pages_project_name: gaston
    secrets: inherit
