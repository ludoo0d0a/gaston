name: Maestro E2E

on:
  workflow_dispatch:
  schedule:
    # Weekly Sunday 04:00 UTC (emulator jobs are slow/expensive)
    - cron: "0 4 * * 0"
  pull_request:
    branches:
      - main
    paths:
      - "androidApp/**"
      - ".maestro/**"
      - ".github/workflows/maestro.yml"

concurrency:
  group: maestro-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json
            if jq -e . androidApp/google-services.json >/dev/null 2>&1; then
              echo "google-services.json written"
            else
              echo "::warning::GOOGLE_SERVICES_JSON invalid; building without Firebase."
              rm -f androidApp/google-services.json
            fi
          else
            echo "GOOGLE_SERVICES_JSON not set; building without Firebase."
          fi

      - name: Assemble fullDebug APK
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          OPENCHARGEMAP_KEY: ${{ secrets.OPENCHARGEMAP_KEY }}
          MOBILITEIT_LUXEMBOURG_KEY: ${{ secrets.MOBILITEIT_LUXEMBOURG_KEY }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          CHARGY_API_KEY: ${{ secrets.CHARGY_API_KEY }}
          GERMANY_TANKERKOENIG_KEY: ${{ secrets.GERMANY_TANKERKOENIG_KEY }}
          FASTNED_UK_KEY: ${{ secrets.FASTNED_UK_KEY }}
          ROMANIA_PECO_APPLICATION_ID: ${{ secrets.ROMANIA_PECO_APPLICATION_ID }}
          ROMANIA_PECO_CLIENT_KEY: ${{ secrets.ROMANIA_PECO_CLIENT_KEY }}
          DKV_SUBSCRIPTION_KEY: ${{ secrets.DKV_SUBSCRIPTION_KEY }}
          DKV_AUTHORIZATION: ${{ secrets.DKV_AUTHORIZATION }}
          ECO_MOVEMENT_KEY: ${{ secrets.ECO_MOVEMENT_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          FUELPRICES_DK_KEY: ${{ secrets.FUELPRICES_DK_KEY }}
          NSW_FUELCHECK_KEY: ${{ secrets.NSW_FUELCHECK_KEY }}
          NSW_FUELCHECK_SECRET: ${{ secrets.NSW_FUELCHECK_SECRET }}
        run: ./gradlew --no-daemon :androidApp:assembleFullDebug

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot ready"

      - name: Run Maestro (ci tag)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            APK=androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
            adb wait-for-device
            adb install -r "$APK"
            # English UI strings are asserted by flows
            adb shell 'settings put system system_locales en-US' || true
            maestro --version
            maestro test .maestro --include-tags ci

      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: .maestro/output
          if-no-files-found: ignore
          retention-days: 14
