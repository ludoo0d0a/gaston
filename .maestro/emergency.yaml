appId: fr.geoking.gaston
tags:
  - smoke
  - ci
  - emergency
---
- launchApp:
    permissions:
      all: allow
- runFlow: common/prepare.yaml
- scrollUntilVisible:
    element:
      id: "dashboard_emergency_card"
- tapOn:
    id: "dashboard_emergency_card"
- assertVisible: "Emergency"
- assertVisible: "Need help now?"
- assertVisible: "Call 112|Tap to call 112"
- back
- assertVisible:
    id: "dashboard_emergency_card"
